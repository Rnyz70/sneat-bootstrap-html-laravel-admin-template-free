services:

  app:
    build: .
    container_name: sneat-app
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    networks: 
      - laravel-network      

  nginx:
    image: nginx:latest
    container_name: sneat-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks: 
      - laravel-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: 
      - laravel-network

networks: 
  laravel-network:

volumes:
  mysql_data:
